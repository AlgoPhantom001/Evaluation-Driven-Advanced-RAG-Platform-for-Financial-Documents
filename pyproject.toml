[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secrag"
version = "0.1.0"
description = "Evaluation-driven retrieval-augmented generation over SEC filings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla", email = "shuklaaw@mail.uc.edu" }]
keywords = ["rag", "llm", "retrieval", "reranking", "evaluation", "sec", "edgar"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "qdrant-client>=1.12.0",
  "fastembed>=0.5.0",
  "rank-bm25>=0.2.2",
  "selectolax>=0.3.21",
  "numpy>=1.26.0",
  "tenacity>=9.0.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "python-dotenv>=1.0.0",
  "orjson>=3.10.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "scikit-learn>=1.5.0",
  "lightgbm>=4.5.0",
  "xgboost>=2.0.0",
  "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "respx>=0.21.0",
  "anyio>=4.6.0",
  "pandas-stubs>=2.2.0",
]

[project.scripts]
secrag = "secrag.cli:app"

[project.urls]
Homepage = "https://github.com/AlgoPhantom001/Evaluation-Driven-Advanced-RAG-Platform-for-Financial-Documents"
Repository = "https://github.com/AlgoPhantom001/Evaluation-Driven-Advanced-RAG-Platform-for-Financial-Documents"

[tool.hatch.build.targets.wheel]
packages = ["src/secrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "RET",
  "PTH",
  "RUF",
  "ASYNC",
  "S",
]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S", "E501"]
"app.py" = ["E402", "S104"]
"src/secrag/core/config.py" = ["S104"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "fastembed.*",
    "selectolax.*",
    "qdrant_client.*",
    "lightgbm.*",
    "sklearn.*",
    "joblib.*",
    "xgboost.*",
    "langchain_core.*",
    "langchain_community.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "secrag.api.app"
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "secrag.core.config"
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = "secrag.core.logging"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "secrag.ingest.parser"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=secrag --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires network or a live model",
  "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/secrag"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
